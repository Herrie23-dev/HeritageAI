name: Build HeritageAI v2

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install vosk sounddevice pywin32

      - name: Build HeritageAI
        run: |
          python -m PyInstaller --onefile --windowed --collect-all vosk --name HeritageAI main.py

      - name: Upload HeritageAI executable
        uses: actions/upload-artifact@v4
        with:
          name: HeritageAI-Windows
          path: dist/HeritageAI.exe
